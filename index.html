<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitals Ledger">
<title>Vitals & Vacation Ledger</title>
<style>
  :root {
    --bg: #EDF1F0;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --accent: #007AFF;
    --border: #E5E5EA;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top));
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  h3 { margin-top: 0; margin-bottom: 12px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  input[type="date"], input[type="number"], input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    width: 100%;
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  .stats-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F2F2F7;
    padding: 12px;
    border-radius: 8px;
  }
  .stats-number {
    font-size: 1.4rem;
    font-weight: bold;
    color: var(--accent);
  }
  .entry-item {
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
  }
  .entry-item:last-child {
    border-bottom: none;
  }
  .entry-header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .vitals-grid {
    font-size: 0.9rem;
    color: #555;
  }
  .vacation-badge {
    background-color: #E5F1FF;
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

  <!-- YTD Vacation Summary -->
  <div class="card">
    <h3><span id="currentYear"></span> Vacation Summary</h3>
    <div class="stats-box">
      <span>Vacation Used YTD:</span>
      <span class="stats-number" id="ytdVacation">0 hrs</span>
    </div>
  </div>

  <!-- Entry Form Card -->
  <div class="card">
    <h3>Log Daily Entry</h3>
    <form id="ledgerForm">
      <div class="form-group">
        <label for="entryDate">Date</label>
        <input type="date" id="entryDate" required>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="sys">Systolic (BP Top)</label>
          <input type="number" id="sys" placeholder="120">
        </div>
        <div class="form-group">
          <label for="dia">Diastolic (BP Bottom)</label>
          <input type="number" id="dia" placeholder="80">
        </div>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="hr">Heart Rate (BPM)</label>
          <input type="number" id="hr" placeholder="72">
        </div>
        <div class="form-group">
          <label for="weight">Weight (lbs)</label>
          <input type="number" step="0.1" id="weight" placeholder="170.5">
        </div>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="temp">Temp (°F)</label>
          <input type="number" step="0.1" id="temp" placeholder="98.6">
        </div>
        <div class="form-group">
          <label for="vacationHours">Vacation Hours</label>
          <input type="number" id="vacationHours" step="0.5" min="0" placeholder="0">
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <input type="text" id="notes" placeholder="Any additional notes...">
      </div>

      <button type="submit">Save Entry</button>
    </form>
  </div>

  <!-- Recent Entries List -->
  <div class="card">
    <h3>History</h3>
    <div id="entriesList">No entries recorded yet.</div>
  </div>

<script>
  const currentYear = new Date().getFullYear();
  document.getElementById('currentYear').innerText = currentYear;
  document.getElementById('entryDate').valueAsDate = new Date();

  function getStoredEntries() {
    return JSON.parse(localStorage.getItem('vitals_ledger') || '[]');
  }

  function saveEntries(entries) {
    localStorage.setItem('vitals_ledger', JSON.stringify(entries));
    render();
  }

  function render() {
    const entries = getStoredEntries();
    const listEl = document.getElementById('entriesList');

    // Calculate YTD Vacation Hours
    const ytdTotal = entries.reduce((total, entry) => {
      const entryYear = new Date(entry.date).getFullYear();
      if (entryYear === currentYear) {
        return total + (parseFloat(entry.vacationHours) || 0);
      }
      return total;
    }, 0);

    document.getElementById('ytdVacation').innerText = `${ytdTotal} hrs`;

    if (entries.length === 0) {
      listEl.innerHTML = 'No entries recorded yet.';
      return;
    }

    listEl.innerHTML = entries
      .sort((a,b) => new Date(b.date) - new Date(a.date))
      .map(entry => {
        const bp = (entry.sys && entry.dia) ? `${entry.sys}/${entry.dia} mmHg` : null;
        const hr = entry.hr ? `${entry.hr} BPM` : null;
        const weight = entry.weight ? `${entry.weight} lbs` : null;
        const temp = entry.temp ? `${entry.temp} °F` : null;

        const vitalsSummary = [bp, hr, weight, temp].filter(Boolean).join(' • ');

        return `
          <div class="entry-item">
            <div class="entry-header">
              <span>${entry.date}</span>
              ${entry.vacationHours > 0 ? `<span class="vacation-badge">${entry.vacationHours} hrs PTO</span>` : ''}
            </div>
            ${vitalsSummary ? `<div class="vitals-grid">${vitalsSummary}</div>` : ''}
            ${entry.notes ? `<div style="font-size: 0.85rem; color: #777; margin-top: 2px;">${entry.notes}</div>` : ''}
          </div>
        `;
      }).join('');
  }

  document.getElementById('ledgerForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const date = document.getElementById('entryDate').value;
    const sys = document.getElementById('sys').value;
    const dia = document.getElementById('dia').value;
    const hr = document.getElementById('hr').value;
    const weight = document.getElementById('weight').value;
    const temp = document.getElementById('temp').value;
    const vacationHours = parseFloat(document.getElementById('vacationHours').value) || 0;
    const notes = document.getElementById('notes').value;

    const entries = getStoredEntries();
    entries.push({ date, sys, dia, hr, weight, temp, vacationHours, notes });
    saveEntries(entries);

    // Reset non-date inputs
    document.getElementById('sys').value = '';
    document.getElementById('dia').value = '';
    document.getElementById('hr').value = '';
    document.getElementById('weight').value = '';
    document.getElementById('temp').value = '';
    document.getElementById('vacationHours').value = '';
    document.getElementById('notes').value = '';
  });

  // Initial render
  render();
</script>
</body>
</html>
